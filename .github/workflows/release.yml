name: Build and publish core

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Upload target (PyPI publication requires a published GitHub release)
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  sdist:
    name: Source distribution
    needs: validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Check version, build and inspect
        run: |
          VERSION=$(python -c 'import runpy; print(runpy.run_path("src/qfcore/_version.py")["__version__"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          python -m pip install --upgrade build twine
          python tools/build_provenance.py --check
          python -m build --sdist
          python -m twine check --strict dist/*
          python tools/check_distributions.py --for-pypi dist/*
      - name: Install the sdist and run its tests outside the repository
        run: |
          SDIST=$(realpath dist/*.tar.gz)
          python -m venv "$RUNNER_TEMP/sdist-env"
          source "$RUNNER_TEMP/sdist-env/bin/activate"
          python -m pip install "${SDIST}[test]"
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$SDIST" -C "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/extracted"/qfcore-*
          python tools/check_installation.py --core-only
          python -m pytest -q
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: core-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels / ${{ matrix.os }}
    needs: validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: pypa/cibuildwheel@v4.2.1
      - name: Check the wheels
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict wheelhouse/*.whl
          python tools/check_distributions.py --for-pypi wheelhouse/*.whl
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: core-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-pypi:
    name: Publish core to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/qfcore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish core to TestPyPI
    needs: [sdist, wheels]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qfcore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
